# FenPOS server and agent on one machine.
#
# For a single shop with the printers attached to the same box that runs the server. The agent
# shares the server network namespace so it can dial 127.0.0.1: plain HTTP is accepted only to
# loopback, so pointing it at http://fenpos:3000 over a Docker network would be refused. With a
# domain and a certificate, drop network_mode and use your https:// address instead.
#
# Start the server, read the setup key from its log, create a pairing code in the panel, put it
# in FENPOS_PAIR_CODE, then bring the agent up.
#
#   docker compose -f compose.all-in-one.yaml up -d fenpos
#   docker compose -f compose.all-in-one.yaml logs fenpos
#   docker compose -f compose.all-in-one.yaml up -d

services:
  fenpos:
    image: ghcr.io/natroutter/fenpos:latest
    container_name: fenpos
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # uid 10001 owns the data inside the container. A bind mount keeps the host owner.
      #   mkdir -p server-data agent-data agent-logs
      #   chmod 700 server-data agent-data agent-logs
      #   sudo chown -R 10001:10001 server-data agent-data agent-logs
      - ./server-data:/app/data
    environment:
      # Required, no default: signs session cookies and tokens. Generate with:
      #   openssl rand -base64 32
      # Set it in the shell that runs `docker compose`, or in a .env file next to this one
      # (docker compose loads that automatically). Never commit the real value. Changing it
      # signs everyone out. It is not stored in the server-data/ volume above.
      BETTER_AUTH_SECRET: "GENERATE_NEW_SECRET"
      BETTER_AUTH_URL: "https://fenpos.example.com"
      TZ: "Europe/Helsinki"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 1g

  fenpos-agent:
    image: ghcr.io/natroutter/fenpos-agent:latest
    container_name: fenpos-agent
    restart: unless-stopped

    # Shares the server's network namespace, so 127.0.0.1 reaches it and plain HTTP is
    # allowed. Requires the server to be healthy first.
    network_mode: "service:fenpos"
    depends_on:
      fenpos:
        condition: service_healthy

    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    group_add:
      - "20"

    # The agent needs no capability at all. Device access comes from the group above, which is
    # a group membership rather than a capability.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # The agent writes to the two directories below and nowhere else, so the root filesystem
    # can stay read-only. A foothold in the process then has nowhere to leave anything a
    # restart would pick up, and the jar itself cannot be rewritten.
    read_only: true
    tmpfs:
      # sqlite-jdbc unpacks its native library into /tmp and loads it from there, so this
      # mount has to allow exec. Docker mounts a tmpfs noexec unless told otherwise, and
      # without exec the driver fails to load and the agent refuses to start.
      - /tmp:exec,size=64m

    volumes:
      - ./agent-data:/app/data
      - ./agent-logs:/app/logs

    environment:
      FENPOS_SERVER: "http://127.0.0.1:3000"
      FENPOS_PAIR_CODE: "AG7K-2M9P-X4TR"
      TZ: "Europe/Helsinki"
      FENPOS_DEBUG: "false"                  # "true": stack traces and per-request detail

    # Raspberry Pi OS disables the cgroup memory controller, so Docker discards this with
    # "Your kernel does not support memory limit capabilities" and the container runs
    # uncapped. To enforce it, append cgroup_enable=memory cgroup_memory=1 to the single
    # line in /boot/firmware/cmdline.txt and reboot.
    mem_limit: 512m
    stdin_open: true
    tty: true
