# FenPOS server on its own.
#
# One server somewhere central. Agents are added later from the panel. Put it behind TLS,
# agents refuse plain HTTP to anything but loopback.
#
#   docker compose -f compose.server.yaml up -d

services:
  fenpos:
    image: ghcr.io/natroutter/fenpos:latest
    container_name: fenpos
    restart: unless-stopped

    ports:
      # Panel, print API and the agent link all share this one port.
      - "3000:3000"

    volumes:
      # Agents, devices, keys, jobs and the hashed account credential all live here. Back it up.
      #
      # The container runs as uid 10001, and a bind mount keeps the host directory owner,
      # so create it and hand it over before the first start or the server cannot open its
      # database:
      #   mkdir -p data && sudo chown -R 10001:10001 data
      - ./data:/app/data

    environment:
      # Required, no default: signs session cookies and tokens. Generate with:
      #   openssl rand -base64 32
      # Set it in the shell that runs `docker compose`, or in a .env file next to this one
      # (docker compose loads that automatically). Never commit the real value. Changing it
      # signs everyone out. It is not stored in the data/ volume above.
      BETTER_AUTH_SECRET: "GENERATE_NEW_SECRET"
      BETTER_AUTH_URL: "https://fenpos.example.com"
      TZ: "Europe/Helsinki"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    mem_limit: 1g
