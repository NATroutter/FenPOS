# ThermAPI configuration
#
# Every device needs its own authKey. Generate one with the 'keygen' console command.
# ThermAPI refuses to start while a device has no key, so it never runs with a shared
# or guessable credential.

httpServer:
    enabled: true
    # Use 0.0.0.0 in a container: a published port maps to the container's external
    # interface, not its loopback, so binding loopback makes the port unreachable.
    host: "127.0.0.1"
    port: 8080
    # Shown in the startup log only, never used for routing.
    publicAddress: ""

# Global request limits. Any of these may be repeated inside a device to override it.
limits:
    maxBodyBytes: 65536
    maxLines: 200
    maxLineChars: 256
    maxTotalChars: 16384
    maxOutputLines: 300
    maxQueueDepth: 100

jobs:
    # How long a finished job stays readable at GET /jobs/<id>.
    retentionMinutes: 10
    maxRecords: 500
    # How long shutdown waits for an in-flight print before failing it.
    shutdownGraceSeconds: 10

devices:
    kitchen:
        # COM3 on Windows, /dev/ttyUSB0 on Linux. Prefer a stable udev alias such as
        # /dev/thermal-kitchen, because ttyUSB numbering changes across reboots.
        port: "COM3"
        baudRate: 9600
        dataBits: 8
        stopBits: 1
        parity: NONE
        flowControl: NONE
        autoConnect: true
        autoReconnect: true
        reconnectDelaySeconds: 5
        writeTimeoutMs: 5000
        # Printable columns: 42 for 80mm paper, 32 for 58mm.
        columns: 42
        # CP858 is the only IBM table carrying both the euro sign and the Nordic vowels.
        codepage: CP858
        # REJECT, REPLACE or STRIP for characters the codepage cannot represent.
        onUnsupported: REJECT
        defaultWrap: true
        defaultLinefeed: LF
        # Required. Run 'keygen' in the console to generate one.
        authKey: ""
