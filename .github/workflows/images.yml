# Checks the server, then builds and publishes the two container images.
#
# The components are versioned and released together, so one workflow covers both rather than
# two that would have to be kept in step. Each is a separate job so that a failure names the
# component that failed, and so the Java and Node builds run in parallel.
name: images

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # The agent's tests run inside its own image build — `mvn package` will not produce a jar
  # without them — so the Java side needs nothing here. The server's do not: `next build`
  # compiles and says nothing about whether anything works, so an untested server image would
  # otherwise be publishable.
  check:
    name: server checks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: fenpos

    steps:
      - uses: actions/checkout@v4

      # Needs the path spelled out: it reads the pnpm version from `packageManager`, and
      # `defaults.run.working-directory` above applies to run steps, not to action inputs, so
      # it would otherwise look for a package.json at the repository root that does not exist.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: fenpos/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fenpos/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The client is generated code, so nothing that reads the database type-checks until it
      # exists — including the tests.
      - run: pnpm db:generate

      - run: pnpm lint

      - run: pnpm typecheck

      # Runs against a real migrated SQLite database, so this covers the migrations too.
      - run: pnpm test

  build:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ubuntu-latest

    permissions:
      # Only what publishing needs: read the tree, write packages. The default token is
      # broader than that.
      contents: read
      packages: write

    strategy:
      # One component failing should not cancel the other — knowing whether both are broken
      # or only one is the first thing worth knowing.
      fail-fast: false
      matrix:
        include:
          - name: server
            context: fenpos
            image: fenpos
          - name: agent
            context: agent
            image: fenpos-agent

    steps:
      - uses: actions/checkout@v4

      # arm64 emulation. Agents are expected on small ARM boxes — a Raspberry Pi behind the
      # counter is the whole point — so an amd64-only image is not much use.
      - uses: docker/setup-qemu-action@v3

      # Needed for cache-to/cache-from and the Dockerfile syntax directive both images use.
      - uses: docker/setup-buildx-action@v3

      # A pull request from a fork cannot have the packages:write token, and publishing from
      # an unreviewed branch would defeat the point of reviewing it. Those builds still run,
      # they just stop before the push.
      - name: Sign in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # `latest` follows the default branch; a release tag also publishes its exact
          # version and the major.minor it belongs to, so a deployment can pin as loosely or
          # as tightly as it wants.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Both Dockerfiles resolve dependencies in their own layer specifically so this
          # cache pays off; without it every run re-downloads Maven Central and the npm
          # registry in full.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
