# Builds and publishes the two container images.
#
# The components are versioned and released together, so one workflow covers both rather than
# two that would have to be kept in step. Each is a separate job so that a failure names the
# component that failed, and so the Java and Node builds run in parallel.
name: images

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    permissions:
      # Only what publishing needs: read the tree, write packages. The default token is
      # broader than that.
      contents: read
      packages: write

    strategy:
      # One component failing should not cancel the other — knowing whether both are broken
      # or only one is the first thing worth knowing.
      fail-fast: false
      matrix:
        include:
          - name: server
            context: fenpos
            image: fenpos
          - name: agent
            context: agent
            image: fenpos-agent

    steps:
      - uses: actions/checkout@v4

      # Needed for cache-to/cache-from and the Dockerfile syntax directive both images use.
      - uses: docker/setup-buildx-action@v3

      # A pull request from a fork cannot have the packages:write token, and publishing from
      # an unreviewed branch would defeat the point of reviewing it. Those builds still run,
      # they just stop before the push.
      - name: Sign in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # `latest` follows the default branch; a release tag also publishes its exact
          # version and the major.minor it belongs to, so a deployment can pin as loosely or
          # as tightly as it wants.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Both Dockerfiles resolve dependencies in their own layer specifically so this
          # cache pays off; without it every run re-downloads Maven Central and the npm
          # registry in full.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
