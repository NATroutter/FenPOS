# Checks the server, then builds and publishes the two container images for amd64 and arm64.
#
# Each architecture is built on a runner of that architecture rather than under emulation.
# QEMU would be one line instead of the digest dance below, but the server has to compile
# argon2, better-sqlite3, the Prisma engines and swc, and doing that emulated turns a
# five-minute build into a great deal longer. ARM runners are free for public repositories,
# so the cost of this is workflow complexity rather than money.
#
# The shape is the standard one for that: every architecture pushes an image *by digest* with
# no tag, and a merge job afterwards collects the digests into one tagged manifest list. Tags
# cannot be applied per-architecture, because the second push would move the tag off the
# first rather than joining it.
#
# Releasing is a `v*` tag and nothing else. Pushing one runs the same checks and builds as any
# other push, publishes the images under that version, and then drafts a GitHub release for it —
# a draft, so that what the release actually says is still written by a person before anyone
# sees it.
name: images

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Nothing inherits a token by default; each job asks for what it needs.
permissions: {}

# A second push to the same branch supersedes the first. Without this the two race, and if
# the older run finishes last it moves `latest` back onto the earlier commit. Tag builds are
# left alone: a release is not superseded by the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  REGISTRY: ghcr.io

jobs:
  # The agent's tests run inside its own image build — `mvn package` will not produce a jar
  # without them — so the Java side needs nothing here. The server's do not: `next build`
  # compiles and says nothing about whether anything works, so an untested server image would
  # otherwise be publishable.
  check:
    name: server checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    defaults:
      run:
        working-directory: fenpos

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Needs the path spelled out: it reads the pnpm version from `packageManager`, and
      # `defaults.run.working-directory` above applies to run steps, not to action inputs, so
      # it would otherwise look for a package.json at the repository root that does not exist.
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: fenpos/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fenpos/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The client is generated code, so nothing that reads the database type-checks until it
      # exists — including the tests.
      - run: pnpm db:generate

      - run: pnpm lint

      - run: pnpm typecheck

      # Runs against a real migrated SQLite database, so this covers the migrations too.
      - run: pnpm test

      # A tag names a version, and both halves of the product read their own from a file in the
      # tree: the panel's footer from package.json (see `lib/runtime.ts`, which says why there is
      # no second source), and the agent's from its pom. A tag that disagrees with them publishes
      # images that report a version nobody released.
      #
      # Checked here rather than in the release job at the end, because here it costs nothing: the
      # fix is to move the tag, and finding out before half an hour of image builds is the whole
      # point of checking at all.
      - name: Check the tag against the versions it claims
        if: github.ref_type == 'tag'
        run: |
          want="${TAG#v}"
          server="$(node -p 'require("./package.json").version')"
          agent="$(sed -n 's:^[[:space:]]*<version>\(.*\)</version>[[:space:]]*$:\1:p' ../agent/pom.xml | sed -n '1p')"

          echo "tag ${TAG} · server ${server} · agent ${agent}"
          if [ "$server" != "$want" ] || [ "$agent" != "$want" ]; then
            echo "::error::${TAG} claims ${want}, but package.json says ${server} and pom.xml says ${agent}. Bump both, or move the tag."
            exit 1
          fi
        env:
          TAG: ${{ github.ref_name }}

  build:
    name: ${{ matrix.name }} · ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      # One component or architecture failing should not cancel the others — knowing whether
      # arm64 alone is broken or everything is, is the first thing worth knowing.
      fail-fast: false
      matrix:
        name: [server, agent]
        arch: [amd64, arm64]
        include:
          - name: server
            image: fenpos
          - name: agent
            image: fenpos-agent
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # ghcr rejects an uppercase path, and this owner is not lowercase.
      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # A pull request from a fork cannot have the packages:write token, and publishing from
      # an unreviewed branch would defeat the point of reviewing it. Those builds still run,
      # they just stop before the push.
      - name: Sign in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the labels and annotations are wanted here. Tags belong to the merge job, which
      # is the only place that can name an image covering both architectures.
      - name: Work out metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}

      - name: Build
        id: bake
        uses: docker/bake-action@v7
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-labels }}
            cwd://${{ steps.meta.outputs.bake-file-annotations }}
          targets: ${{ matrix.name }}
          # Everything overridden here is a property of where this build is running rather
          # than of what is being built, which is why it is not in docker-bake.hcl.
          #
          # Tags are cleared because pushing by digest refuses any tagged ref, and the targets
          # carry a :local tag so that `docker buildx bake` produces something usable on a
          # laptop. The merge job is the only place that can name an image covering both
          # architectures, so it is the only place tags are set.
          #
          # Cache is scoped per architecture as well as per component; one cache shared
          # between them would thrash, each build evicting the other's layers.
          #
          # On a pull request nothing is pushed, so there is no digest to collect and the
          # build is only proving that it still compiles.
          set: |
            *.tags=
            *.platform=${{ matrix.platform }}
            *.cache-from=type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}
            *.output=${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0}/{1}/{2},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, steps.owner.outputs.name, matrix.image) }}

      # The digest is all the merge job needs. Passing it as a file named after itself avoids
      # having to care which architecture wrote it.
      #
      # `success()` is spelled out because writing any `if` at all removes the implicit one, and
      # without it this step still runs after the build has failed. There is no metadata output
      # to read then, so `fromJSON` below is handed an empty string and the job reports "The
      # template is not valid ... Error reading JToken" — an error about this file, pointing at
      # this line, for a failure that happened in the build. It cost a real debugging session.
      - name: Export the digest
        if: ${{ success() && github.event_name != 'pull_request' }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ fromJSON(steps.bake.outputs.metadata)[matrix.name]['containerimage.digest'] }}

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish ${{ matrix.name }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            image: fenpos
          - name: agent
            image: fenpos-agent

    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Collect the digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.name }}-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}
          # Without this, metadata-action's default of `latest=auto` adds `latest` to any
          # stable semver tag, so publishing v1.4.2 would quietly move `latest` onto it even
          # while the rule below says `latest` tracks the default branch.
          flavor: |
            latest=false
          # `latest` follows the default branch; a release tag also publishes its exact
          # version and the major.minor it belongs to, so a deployment can pin as loosely or
          # as tightly as it wants.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # One manifest list per tag, listing every architecture's digest. This is the point at
      # which the images become pullable by name.
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${OWNER}/${IMAGE}@sha256:%s " *)
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ steps.owner.outputs.name }}
          IMAGE: ${{ matrix.image }}

      - name: Show what was published
        run: docker buildx imagetools inspect "${REGISTRY}/${OWNER}/${IMAGE}:${VERSION}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ steps.owner.outputs.name }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}

  # A tag push publishes images named after it; this is what turns that into something a person
  # can read. It writes a **draft**, never a published release: what a release says is an editorial
  # matter — what changed, what it breaks, what to do about it — and a workflow has no business
  # deciding that. The generated changelog and the pull commands are the tedious half, filled in
  # ready for the rest to be written by hand and the Publish button pressed.
  #
  # `needs: merge`, so a release is only ever drafted for images that actually exist. A draft
  # pointing at tags nothing published would be worse than no draft.
  release:
    name: draft the release
    needs: merge
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Nothing is checked out: the notes are written here and the changelog is generated by
      # GitHub from the tags themselves, so there is no file in the tree this needs.
      - name: Draft the release
        run: |
          # Re-running the workflow on a tag must not overwrite notes somebody has since edited,
          # and must certainly not revert a published release to a draft. An existing release is
          # left exactly as it is.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release already exists for ${TAG}; left untouched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          version="${TAG#v}"

          # Written with `echo` rather than a heredoc: a heredoc keeps the indentation this file
          # is written at, and four spaces at the start of a Markdown line is a code block.
          {
            echo '### Images'
            echo
            echo '```'
            echo "docker pull ${REGISTRY}/${OWNER}/fenpos:${version}"
            echo "docker pull ${REGISTRY}/${OWNER}/fenpos-agent:${version}"
            echo '```'
            echo
            # The minor tag is only claimed for a real release. metadata-action leaves
            # `{{major}}.{{minor}}` off a pre-release, so v1.2.0-rc.1 publishes its exact version
            # and nothing else — and `${version%.*}` would have named `1.2.0-rc`, a tag that has
            # never existed, in notes telling somebody to deploy it.
            if [ "$PRERELEASE" = "true" ]; then
              echo 'A pre-release, published under its exact version only.'
            else
              echo "Also published as \`${version%.*}\` for a deployment pinning to the minor."
            fi
            echo "\`latest\` is not moved by a release; it follows the default branch."
          } > notes.md

          # `generate_release_notes` writes the changelog from the commits since the last tag, and
          # the REST API prepends this body to it — so the images come first, where somebody
          # deploying will look, and the commit list follows.
          url="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --method POST \
            -f tag_name="$TAG" \
            -f name="$TAG" \
            -f body="$(cat notes.md)" \
            -F draft=true \
            -F prerelease="$PRERELEASE" \
            -F generate_release_notes=true \
            --jq '.html_url')"

          echo "Drafted [${TAG}](${url}). Edit it and press Publish." >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          # Nothing is checked out, so there is no git remote for `gh` to read the repository from
          # and it does not fall back to GITHUB_REPOSITORY on its own.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ steps.owner.outputs.name }}
          # A hyphen is what separates a semver pre-release from its version — v1.2.0-rc.1 — and
          # metadata-action reads the same tags the same way, so the two agree on what is a
          # release by construction rather than by a rule written twice.
          PRERELEASE: ${{ contains(github.ref_name, '-') && 'true' || 'false' }}
